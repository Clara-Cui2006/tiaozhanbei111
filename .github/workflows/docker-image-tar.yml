name: Docker image tar

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-image-tar.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to package, full commit SHA recommended"
        required: true
        default: "253e3c35955795f6a48d2da519ba707a04d41bdd"

permissions:
  contents: read

jobs:
  build-linux-amd64-tar:
    name: Build linux/amd64 image tar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '253e3c35955795f6a48d2da519ba707a04d41bdd' }}

      - name: Prepare Docker delivery files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker

          cat > Dockerfile <<'DOCKERFILE'
          FROM node:22-alpine AS frontend-build

          WORKDIR /app
          COPY package*.json ./
          RUN npm ci
          COPY . .
          ENV VITE_API_BASE_URL=/api
          RUN npm run build

          FROM python:3.12-slim AS runtime

          ENV PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1 \
              APP_ENV=production \
              DATABASE_PATH=/data/platform.db \
              TOKEN_TTL_MINUTES=30

          WORKDIR /app

          RUN apt-get update \
              && apt-get install -y --no-install-recommends nginx ca-certificates \
              && rm -rf /var/lib/apt/lists/*

          COPY requirements-server.txt /app/requirements-server.txt
          RUN pip install --no-cache-dir -r /app/requirements-server.txt

          COPY server /app/server
          COPY --from=frontend-build /app/dist /usr/share/nginx/html
          COPY docker/nginx.conf /etc/nginx/conf.d/default.conf
          COPY docker/start.sh /app/start.sh

          RUN chmod +x /app/start.sh \
              && mkdir -p /data /run/nginx /var/log/nginx

          EXPOSE 80

          HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
            CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3).read()" || exit 1

          CMD ["/app/start.sh"]
          DOCKERFILE

          cat > docker/nginx.conf <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;
            server_tokens off;
            client_max_body_size 20m;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

            location /api/ {
              proxy_pass http://127.0.0.1:8090/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 120s;
            }

            location / {
              try_files $uri $uri/ /index.html;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
              expires 7d;
              add_header Cache-Control "public, max-age=604800, immutable";
              try_files $uri =404;
            }

            location ~ /\. {
              deny all;
            }
          }
          NGINX

          cat > docker/start.sh <<'START'
          #!/bin/sh
          set -eu

          mkdir -p /data /run/nginx /var/log/nginx

          uvicorn server.main:app --host 127.0.0.1 --port 8090 --proxy-headers --forwarded-allow-ips=127.0.0.1 &
          API_PID="$!"

          sleep 2
          if ! kill -0 "$API_PID" 2>/dev/null; then
            echo "Backend failed to start."
            wait "$API_PID"
          fi

          nginx -g 'daemon off;' &
          NGINX_PID="$!"

          trap 'kill "$API_PID" "$NGINX_PID" 2>/dev/null || true; wait "$API_PID" "$NGINX_PID" 2>/dev/null || true' INT TERM
          wait "$NGINX_PID"
          START

          cat > .dockerignore <<'IGNORE'
          .git
          .github
          .vscode
          .idea
          node_modules
          dist
          release
          artifacts
          offline-bundle
          var
          logs
          *.log
          *.local
          .env
          .env.*
          __pycache__
          *.pyc
          coverage
          .venv
          .venv-preview
          venv
          IGNORE

          chmod +x docker/start.sh

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "tiaozhanbei-platform:$IMAGE_TAG" .

      - name: Save Docker image tar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker save "tiaozhanbei-platform:$IMAGE_TAG" -o "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar"
          sha256sum "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar" > "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar.sha256"

          cat > out/.env.example <<'ENVFILE'
          HOST_PORT=8080
          APP_ENV=production
          DATABASE_PATH=/data/platform.db
          TOKEN_TTL_MINUTES=30
          JWT_SECRET=please-change-this-to-a-random-string-at-least-32-chars
          BOOTSTRAP_ADMIN_USERNAME=admin
          BOOTSTRAP_ADMIN_PASSWORD=ChangeMe_123456

          # Please confirm the IP. User-provided value was: 192.1683.100:7792/V1
          MODEL_BASE_URL=http://192.168.3.100:7792/v1
          MODEL_API_KEY=
          MODEL_NAME=qwen36-27b-fp4
          MODEL_TIMEOUT_SECONDS=60
          ENVFILE

          cat > out/README-docker-tar.md <<'README'
          # Docker tar usage

          Load image:

          ```bash
          docker load -i tiaozhanbei-253e3c3-linux-amd64.tar
          ```

          Run container:

          ```bash
          docker run -d \
            --name tiaozhanbei-platform \
            --restart unless-stopped \
            -p 8080:80 \
            --env-file .env \
            -v tiaozhanbei-data:/data \
            tiaozhanbei-platform:253e3c3
          ```

          Open:

          ```text
          http://127.0.0.1:8080
          ```

          If using another source_ref, replace `253e3c3` with the artifact tag.
          README

      - name: Upload Docker image tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiaozhanbei-${{ env.IMAGE_TAG }}-linux-amd64
          path: out/
          if-no-files-found: error
          retention-days: 14
