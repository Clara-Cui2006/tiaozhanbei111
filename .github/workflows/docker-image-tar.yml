name: Docker image tar

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to package, full commit SHA recommended"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build-linux-amd64-tar:
    name: Build linux/amd64 image tar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Prepare Docker delivery files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker/nginx.conf
          test -f docker/start.sh
          chmod +x docker/start.sh

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "tiaozhanbei-platform:$IMAGE_TAG" .

      - name: Save Docker image tar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker save "tiaozhanbei-platform:$IMAGE_TAG" -o "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar"
          sha256sum "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar" > "out/tiaozhanbei-${IMAGE_TAG}-linux-amd64.tar.sha256"

          cp docker.env.template out/.env.example

          cat > out/README-docker-tar.md <<'README'
          # Docker tar usage

          Load image:

          ```bash
          docker load -i tiaozhanbei-<tag>-linux-amd64.tar
          ```

          Run container:

          ```bash
          docker run -d \
            --name tiaozhanbei-platform \
            --restart unless-stopped \
            -p 8080:80 \
            --env-file .env \
            -v tiaozhanbei-data:/data \
            tiaozhanbei-platform:<tag>
          ```

          Open:

          ```text
          http://127.0.0.1:8080
          ```

          Replace `<tag>` with the seven-character tag in the artifact filename.
          README

      - name: Upload Docker image tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiaozhanbei-${{ env.IMAGE_TAG }}-linux-amd64
          path: out/
          if-no-files-found: error
          retention-days: 14
