services:
  tiaozhanbei:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiaozhanbei-platform:latest
    container_name: tiaozhanbei-platform
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - tiaozhanbei-data:/data

volumes:
  tiaozhanbei-data:
