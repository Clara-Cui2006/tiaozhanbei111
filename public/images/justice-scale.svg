<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 底座 -->
  <rect x="80" y="170" width="40" height="12" rx="3" fill="url(#grad1)" opacity="0.9"/>
  <rect x="60" y="178" width="80" height="8" rx="4" fill="url(#grad1)" opacity="0.7"/>
  <!-- 立柱 -->
  <rect x="96" y="45" width="8" height="130" rx="2" fill="url(#grad2)"/>
  <!-- 横梁 -->
  <rect x="25" y="42" width="150" height="6" rx="3" fill="url(#grad2)"/>
  <!-- 顶部圆 -->
  <circle cx="100" cy="38" r="12" fill="url(#grad3)" stroke="rgba(90,214,255,0.4)" stroke-width="1.5"/>
  <text x="100" y="43" text-anchor="middle" fill="#e8f8ff" font-size="14" font-weight="bold">法</text>
  <!-- 左盘链条 -->
  <line x1="40" y1="48" x2="40" y2="95" stroke="rgba(90,214,255,0.5)" stroke-width="2"/>
  <line x1="30" y1="48" x2="50" y2="48" stroke="rgba(90,214,255,0.5)" stroke-width="2"/>
  <!-- 左盘 -->
  <ellipse cx="40" cy="98" rx="30" ry="8" fill="url(#grad1)" opacity="0.8"/>
  <path d="M10 98 Q40 115 70 98" stroke="rgba(90,214,255,0.3)" stroke-width="1" fill="rgba(20,60,120,0.4)"/>
  <!-- 右盘链条 -->
  <line x1="160" y1="48" x2="160" y2="80" stroke="rgba(90,214,255,0.5)" stroke-width="2"/>
  <line x1="150" y1="48" x2="170" y2="48" stroke="rgba(90,214,255,0.5)" stroke-width="2"/>
  <!-- 右盘 -->
  <ellipse cx="160" cy="83" rx="30" ry="8" fill="url(#grad1)" opacity="0.8"/>
  <path d="M130 83 Q160 100 190 83" stroke="rgba(90,214,255,0.3)" stroke-width="1" fill="rgba(20,60,120,0.4)"/>
  <!-- 光效 -->
  <circle cx="100" cy="38" r="25" fill="none" stroke="rgba(90,214,255,0.15)" stroke-width="1">
    <animate attributeName="r" values="25;35;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(60,170,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(30,100,200,0.4)"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(90,214,255,0.7)"/>
      <stop offset="100%" style="stop-color:rgba(40,130,220,0.5)"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(50,160,255,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(20,80,180,0.6)"/>
    </linearGradient>
  </defs>
</svg>
